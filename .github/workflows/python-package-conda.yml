name: CPU software verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: corrected-paper3
            directory: KEAF-Net-code
            lint_paths: keaf_net scripts tests
          - package: root-reference
            directory: .
            lint_paths: src scripts tests
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU runtime and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest flake8
          python -m pip check
      - name: Check syntax and undefined names
        run: python -m flake8 ${{ matrix.lint_paths }} --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run package tests
        run: python -m pytest tests -q --junitxml=ci-results/tests.xml
      - name: Verify corrected training path and entry points
        if: matrix.package == 'corrected-paper3'
        run: |
          python scripts/verify_dc3_repairs.py --junit ci-results/tests.xml --out ci-results/software_verification.json
          python scripts/train.py --help
          python scripts/evaluate.py --help
      - name: Smoke-test root reference
        if: matrix.package == 'root-reference'
        run: python scripts/smoke_test.py
      - name: Record environment
        if: always()
        run: |
          mkdir -p ci-results
          python -m pip freeze > ci-results/environment.txt
      - name: Retain software verification records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-verification-${{ matrix.package }}
          path: ${{ matrix.directory }}/ci-results/
          if-no-files-found: warn

# These jobs use synthetic fixtures. They do not train or evaluate a benchmark,
# reproduce manuscript accuracies, or validate historical experimental results.
