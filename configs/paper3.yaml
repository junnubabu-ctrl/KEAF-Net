seed: 42
model:
  hidden_dim: 768
  visual:
    grid_encoder: vit_b_16
    grid_pretraining: imagenet21k
    region_encoder: faster_rcnn_visual_genome
    region_proposals: 36
    region_input_dim: 2048
    output_dim: 768
  text:
    encoder: bert-base-uncased
    output_dim: 768
  knowledge:
    sources: [conceptnet, cskg]
    triplet_encoder: sentence-transformers/all-mpnet-base-v2
    top_k: 50
    output_dim: 768
  akf:
    threshold_init: 0.5
  hgaf:
    heads: 8
    layers: 2
    edge_types: [visual_spatial, text_sequential, visual_knowledge_coreference, text_knowledge_coreference, visual_text_semantic]
  mhsr:
    hops: 3
  classifier:
    num_answers: 3129
training:
  optimizer: adamw
  learning_rate: 0.0001
  scheduler: cosine
  batch_size: 64
  epochs: 20
  akf_loss_weight: 0.3
  gradient_clip_norm: 1.0
evaluation:
  metric: vqa_soft_accuracy
  datasets: [vqa_v2, ok_vqa, a_okvqa, gqa, textvqa]
notes:
  - Values above follow the Paper 3 manuscript where specified.
  - Sentence-BERT checkpoint name and 3129-answer vocabulary are configurable implementation choices unless matched to the final experiment artifacts.
  - Reported manuscript metrics must not be labelled reproduced until generated by this repository.
