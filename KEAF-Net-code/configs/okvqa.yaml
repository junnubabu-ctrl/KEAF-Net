# OK-VQA (5,046-question evaluation split). Reported: 68.7 +/- 0.2 %.
experiment: keaf_net_okvqa
seed: 42
device: cuda
output_dir: outputs/okvqa

model:
  hidden_dim: 768
  max_triplets: 50          # P
  akf_threshold_init: 0.5   # c_th (learned)
  akf_temperature: 0.1      # T_temp
  akf_loo_samples: 10       # |S|
  gat_heads: 8
  gat_layers: 2
  num_hops: 3               # T
  num_answers: 3129
  dropout: 0.1

optim:
  lr: 1.0e-4
  min_lr: 1.0e-6
  weight_decay: 0.01
  epochs: 20
  batch_size: 64
  early_stop_patience: 3
  akf_loss_weight: 0.3      # w_AKF

data:
  dataset: okvqa
  data_root: data
  feature_root: features
  knowledge_cache: knowledge/cache
  num_regions: 36
  answer_vocab: data/okvqa/answer_vocab.json
