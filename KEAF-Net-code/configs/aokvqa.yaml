# A-OKVQA (direct-answer test split). Reported: 62.4 +/- 0.3 %.
experiment: keaf_net_aokvqa
seed: 42
device: cuda
output_dir: outputs/aokvqa

model:
  hidden_dim: 768
  max_triplets: 50
  akf_threshold_init: 0.5
  akf_temperature: 0.1
  akf_loo_samples: 10
  gat_heads: 8
  gat_layers: 2
  num_hops: 3
  num_answers: 3129
  dropout: 0.1

optim:
  lr: 1.0e-4
  min_lr: 1.0e-6
  weight_decay: 0.01
  epochs: 20
  batch_size: 64
  early_stop_patience: 3
  akf_loss_weight: 0.3

data:
  dataset: aokvqa
  data_root: data
  feature_root: features
  knowledge_cache: knowledge/cache
  num_regions: 36
  answer_vocab: data/aokvqa/answer_vocab.json
