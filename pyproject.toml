[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keaf-net"
version = "0.1.0"
description = "Research implementation scaffold for Knowledge-Enhanced Attention Fusion Network (KEAF-Net) for VQA"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "KEAF-Net Research Project"}]
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
full = [
  "transformers>=4.40",
  "sentence-transformers>=2.7",
  "torchvision>=0.17",
  "networkx>=3.2",
  "tqdm>=4.66",
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
